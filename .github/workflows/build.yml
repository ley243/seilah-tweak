name: Build Seilah

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: theos/theos-action@v1
        with:
          cache: false
          sdks-url: https://github.com/theos/sdks/releases/download/main/iPhoneOS16.5.sdk.tar.xz

      - name: Build tweak
        run: |
          make package FINALPACKAGE=1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: seilah-deb
          path: packages/*.deb
          if-no-files-found: error
